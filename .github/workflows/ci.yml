name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: qd, POSTGRES_PASSWORD: qd, POSTGRES_DB: quickdelivery_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://qd:qd@localhost:5432/quickdelivery_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrate test DB
        working-directory: apps/backend
        run: pnpm prisma generate && DATABASE_URL=$TEST_DATABASE_URL pnpm prisma migrate deploy
      - name: Backend typecheck + tests
        working-directory: apps/backend
        run: pnpm lint && pnpm test
      - name: Web build
        working-directory: apps/web
        run: pnpm build

  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
